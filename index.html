<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fleet Recovery — Accident Vehicle Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg0:#0A0E1A; --bg1:#0E1424; --panel:#141B2E; --panel2:#1A2338; --panel3:#212C46;
    --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.12);
    --text:#EDF1FA; --text2:#AEB7CC; --muted:#727E99;
    --amber:#FFB020; --amber2:#FFC658;
    --teal:#2DD4BF; --green:#34D399; --red:#FB7185; --blue:#60A5FA; --purple:#A78BFA;
    --plate:#F4C20D;
    --r:16px; --r2:20px;
    --shadow:0 2px 8px rgba(0,0,0,.3), 0 12px 40px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Inter',system-ui,sans-serif;color:var(--text);font-size:14px;line-height:1.45;
    background:
      radial-gradient(1200px 600px at 78% -8%, rgba(255,176,32,.10), transparent 60%),
      radial-gradient(1000px 700px at -5% 105%, rgba(96,165,250,.10), transparent 55%),
      linear-gradient(160deg, var(--bg1), var(--bg0));
    background-attachment:fixed;-webkit-font-smoothing:antialiased;
  }
  .num{font-variant-numeric:tabular-nums;font-family:'JetBrains Mono',monospace}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select{font-family:inherit;font-size:14px}
  a{color:var(--blue)}
  ::selection{background:var(--amber);color:#1a1400}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:8px}

  /* ---------- shell ---------- */
  .app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
  .side{
    position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:20px 14px;
    background:linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,0));
    border-right:1px solid var(--line);backdrop-filter:blur(8px);
  }
  .brand{display:flex;align-items:center;gap:11px;padding:4px 8px 18px;border-bottom:1px solid var(--line);margin-bottom:6px}
  .brand .mark{width:38px;height:38px;border-radius:11px;flex:none;display:grid;place-items:center;
    background:linear-gradient(145deg,var(--amber2),var(--amber));box-shadow:0 6px 18px rgba(255,176,32,.35)}
  .brand .mark svg{width:21px;height:21px}
  .brand h1{font-family:'Space Grotesk';font-size:15.5px;font-weight:700;letter-spacing:-.2px;line-height:1.05}
  .brand small{display:block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-top:3px;font-weight:600}
  .nav{display:flex;flex-direction:column;gap:3px;margin-top:16px}
  .nav button{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:11px;color:var(--text2);
    font-weight:600;font-size:13.5px;text-align:left;width:100%;transition:.16s;position:relative}
  .nav button svg{width:18px;height:18px;flex:none;opacity:.8}
  .nav button:hover{background:rgba(255,255,255,.05);color:var(--text)}
  .nav button.active{color:#1a1400;background:linear-gradient(145deg,var(--amber2),var(--amber));box-shadow:0 6px 18px rgba(255,176,32,.3)}
  .nav button.active svg{opacity:1}
  .nav .badge{margin-left:auto;font-size:11px;font-weight:700;padding:1px 8px;border-radius:20px;background:rgba(251,113,133,.18);color:var(--red)}
  .nav button.active .badge{background:rgba(0,0,0,.15);color:#3a2b00}
  .side .spacer{flex:1}
  .side .io{display:flex;gap:6px;margin-top:10px}
  .side .io button{flex:1;font-size:11.5px;font-weight:600;color:var(--text2);padding:9px;border-radius:9px;border:1px solid var(--line);transition:.15s}
  .side .io button:hover{color:var(--text);border-color:var(--line2);background:rgba(255,255,255,.04)}
  #signout{display:none;margin-top:8px;width:100%;font-size:11.5px;font-weight:600;color:var(--muted);padding:8px;border-radius:9px;border:1px solid var(--line)}
  #signout:hover{color:var(--red);border-color:rgba(251,113,133,.4)}
  .savepill{font-size:11px;color:var(--muted);text-align:center;margin-top:12px;height:14px;transition:.3s}
  .savepill.on{color:var(--amber)}

  /* ---------- main ---------- */
  .main{padding:26px 34px 70px;max-width:1240px}
  .topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap}
  .topbar .h{font-family:'Space Grotesk';font-size:27px;font-weight:700;letter-spacing:-.6px}
  .topbar .sub{color:var(--muted);font-size:13px;margin-top:4px}
  .btn{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:13.5px;padding:11px 17px;border-radius:12px;transition:.16s;
    background:linear-gradient(145deg,var(--amber2),var(--amber));color:#1a1400;box-shadow:0 8px 22px rgba(255,176,32,.3)}
  .btn:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(255,176,32,.4)}
  .btn svg{width:16px;height:16px}
  .btn.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line2);box-shadow:none}
  .btn.ghost:hover{background:var(--panel3);transform:translateY(-1px);box-shadow:none}
  .btn.sm{padding:8px 13px;font-size:12.5px}
  .btn.danger{background:var(--panel2);color:var(--red);border:1px solid rgba(251,113,133,.3);box-shadow:none}
  .btn.danger:hover{background:rgba(251,113,133,.12)}

  /* cards */
  .card{background:linear-gradient(160deg,var(--panel),var(--bg1));border:1px solid var(--line);border-radius:var(--r2);box-shadow:var(--shadow)}
  .card .ch{display:flex;align-items:center;justify-content:space-between;padding:17px 20px;border-bottom:1px solid var(--line)}
  .card .ch h3{font-family:'Space Grotesk';font-size:15px;font-weight:600;display:flex;align-items:center;gap:9px}
  .card .ch h3 svg{width:17px;height:17px;color:var(--amber)}
  .card .ch .cnt{font-size:12px;color:var(--muted);font-weight:600}

  /* ---------- KPI hero ---------- */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:18px}
  .kpi{position:relative;overflow:hidden;border-radius:var(--r2);padding:19px 20px;cursor:pointer;transition:.2s;
    background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line)}
  .kpi:hover{transform:translateY(-3px);border-color:var(--line2)}
  .kpi .glow{position:absolute;width:150px;height:150px;border-radius:50%;filter:blur(45px);opacity:.5;top:-50px;right:-40px}
  .kpi.blue .glow{background:var(--blue)} .kpi.amber .glow{background:var(--amber)}
  .kpi.red .glow{background:var(--red)} .kpi.green .glow{background:var(--green)}
  .kpi .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;margin-bottom:14px;position:relative}
  .kpi .ic svg{width:18px;height:18px}
  .kpi.blue .ic{background:rgba(96,165,250,.16);color:var(--blue)} .kpi.amber .ic{background:rgba(255,176,32,.16);color:var(--amber)}
  .kpi.red .ic{background:rgba(251,113,133,.16);color:var(--red)} .kpi.green .ic{background:rgba(52,211,153,.16);color:var(--green)}
  .kpi .lab{font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);position:relative}
  .kpi .val{font-family:'Space Grotesk';font-size:30px;font-weight:700;letter-spacing:-1px;margin-top:6px;line-height:1;position:relative}
  .kpi .val.money{font-size:26px}
  .kpi .meta{font-size:12px;color:var(--text2);margin-top:8px;position:relative}
  .kpi .arrow{position:absolute;right:18px;bottom:16px;color:var(--muted);opacity:0;transition:.2s}
  .kpi:hover .arrow{opacity:1;right:14px}

  .grid2{display:grid;grid-template-columns:1.25fr .75fr;gap:18px;align-items:start;margin-bottom:18px}

  /* cash flow bars */
  .flow{padding:20px}
  .flowbar{margin-bottom:16px}
  .flowbar:last-child{margin-bottom:0}
  .flowbar .fl{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
  .flowbar .fl .k{font-size:12.5px;color:var(--text2);font-weight:600}
  .flowbar .fl .v{font-family:'JetBrains Mono';font-weight:700;font-size:14px}
  .track{height:11px;border-radius:8px;background:rgba(255,255,255,.05);overflow:hidden}
  .track i{display:block;height:100%;border-radius:8px;transition:width 1s cubic-bezier(.2,.8,.2,1)}
  .track i.est{background:linear-gradient(90deg,#3b4463,#5a6893)}
  .track i.ord{background:linear-gradient(90deg,var(--amber),var(--amber2))}
  .track i.bil{background:linear-gradient(90deg,#3b82f6,var(--blue))}
  .track i.rec{background:linear-gradient(90deg,#10b981,var(--green))}
  .flowfoot{display:flex;justify-content:space-between;align-items:center;margin-top:20px;padding-top:18px;border-top:1px solid var(--line)}
  .flowfoot .lab{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
  .flowfoot .big{font-family:'Space Grotesk';font-size:24px;font-weight:700;color:var(--red)}
  .ringwrap{display:flex;align-items:center;gap:16px}
  .ring{width:78px;height:78px;flex:none;transform:rotate(-90deg)}
  .ring .rbg{fill:none;stroke:rgba(255,255,255,.08);stroke-width:9}
  .ring .rfg{fill:none;stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)}
  .ringtxt .p{font-family:'Space Grotesk';font-size:22px;font-weight:700}
  .ringtxt .s{font-size:11.5px;color:var(--muted)}

  /* attention */
  .att{display:flex;flex-direction:column;max-height:340px;overflow:auto}
  .att .row{display:flex;align-items:center;gap:12px;padding:13px 20px;border-bottom:1px solid var(--line);cursor:pointer;transition:.12s}
  .att .row:hover{background:rgba(255,255,255,.03)}
  .att .row:last-child{border-bottom:none}
  .att .ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex:none}
  .att .ic svg{width:16px;height:16px}
  .att .ic.amber{background:rgba(255,176,32,.15);color:var(--amber)} .att .ic.red{background:rgba(251,113,133,.15);color:var(--red)}
  .att .tx{flex:1;min-width:0} .att .tx b{font-weight:600;font-size:13.5px} .att .tx span{display:block;color:var(--muted);font-size:12px}
  .att .empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:13px}

  /* status strip */
  .statusstrip{display:flex;flex-wrap:wrap;gap:8px;padding:18px 20px}
  .sbadge{display:inline-flex;align-items:center;gap:8px;padding:7px 13px;border-radius:20px;background:rgba(255,255,255,.04);border:1px solid var(--line);font-size:12.5px;font-weight:600;cursor:default}
  .sbadge b{font-family:'JetBrains Mono'} .sbadge .dot{width:7px;height:7px;border-radius:50%}

  /* ---------- vehicle grid ---------- */
  .vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:15px}
  .vcard{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:var(--r);padding:17px;cursor:pointer;transition:.18s;position:relative;overflow:hidden}
  .vcard:hover{transform:translateY(-3px);border-color:var(--line2);box-shadow:var(--shadow)}
  .vcard .vtop{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px}
  .vcard .model{font-family:'Space Grotesk';font-size:16px;font-weight:600;margin-top:12px}
  .vcard .cust{color:var(--muted);font-size:12.5px;margin-top:2px}
  .vcard .vmeta{display:flex;align-items:center;justify-content:space-between;margin-top:14px;padding-top:13px;border-top:1px solid var(--line)}
  .vcard .est{font-size:12px;color:var(--text2)} .vcard .est b{font-family:'JetBrains Mono';color:var(--text)}
  .money{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:5px 11px;border-radius:20px;font-family:'JetBrains Mono'}
  .money::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
  .money.red{background:rgba(251,113,133,.14);color:var(--red)} .money.green{background:rgba(52,211,153,.14);color:var(--green)}
  .money.muted{background:rgba(255,255,255,.05);color:var(--muted)} .money.blue{background:rgba(96,165,250,.14);color:var(--blue)}

  /* plate */
  .plate{font-family:'JetBrains Mono';font-weight:700;background:linear-gradient(180deg,#f7ce22,var(--plate));color:#141414;
    border:1.5px solid #141414;border-radius:6px;padding:4px 9px;font-size:12.5px;letter-spacing:.5px;white-space:nowrap;
    display:inline-flex;box-shadow:0 2px 6px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.5)}
  .plate.big{font-size:20px;padding:8px 15px;border-radius:8px;border-width:2px}

  .chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:5px 11px;border-radius:20px;white-space:nowrap}
  .chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
  .chip.slate{background:rgba(255,255,255,.06);color:var(--text2)} .chip.amber{background:rgba(255,176,32,.15);color:var(--amber)}
  .chip.blue{background:rgba(96,165,250,.15);color:var(--blue)} .chip.teal{background:rgba(45,212,191,.15);color:var(--teal)}
  .chip.red{background:rgba(251,113,133,.15);color:var(--red)} .chip.green{background:rgba(52,211,153,.15);color:var(--green)}

  /* ---------- generic list table ---------- */
  .tbl{width:100%;border-collapse:collapse}
  .tbl th{text-align:left;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:12px 20px;border-bottom:1px solid var(--line)}
  .tbl td{padding:14px 20px;border-bottom:1px solid var(--line);font-size:13.5px}
  .tbl tr:last-child td{border-bottom:none}
  .tbl tr.clk{cursor:pointer;transition:.12s} .tbl tr.clk:hover td{background:rgba(255,255,255,.03)}
  .tbl .mono{font-family:'JetBrains Mono';font-variant-numeric:tabular-nums}
  .tbl .r{text-align:right}
  .agepill{display:inline-flex;font-family:'JetBrains Mono';font-weight:700;font-size:12px;padding:3px 9px;border-radius:8px}
  .agepill.a0{background:rgba(52,211,153,.14);color:var(--green)}
  .agepill.a1{background:rgba(255,176,32,.14);color:var(--amber)}
  .agepill.a2{background:rgba(251,146,60,.16);color:#fb923c}
  .agepill.a3{background:rgba(251,113,133,.16);color:var(--red)}

  /* buckets */
  .buckets{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
  .bucket{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
  .bucket .bl{font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .bucket .bv{font-family:'Space Grotesk';font-size:22px;font-weight:700;margin-top:8px}
  .bucket .bc{font-size:12px;color:var(--text2);margin-top:5px}
  .bucket.warn{border-color:rgba(251,113,133,.3)} .bucket.warn .bv{color:var(--red)}

  /* ---------- detail ---------- */
  .back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-weight:600;font-size:13px;margin-bottom:16px}
  .back:hover{color:var(--text)}
  .dhead{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:7px}
  .dhead .model{font-family:'Space Grotesk';font-size:24px;font-weight:700;letter-spacing:-.4px}
  .dcust{color:var(--muted);font-size:13.5px;margin-bottom:22px}
  .dcust b{color:var(--text2);font-weight:600}
  .timeline{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 8px;margin-bottom:16px;overflow-x:auto;box-shadow:var(--shadow)}
  .tstep{flex:1;min-width:120px;text-align:center;position:relative;padding:0 6px}
  .tstep::before{content:"";position:absolute;top:12px;left:-50%;width:100%;height:2px;background:var(--line2)}
  .tstep:first-child::before{display:none}
  .tstep.done::before{background:var(--green)}
  .tdot{width:24px;height:24px;border-radius:50%;background:var(--panel3);border:2px solid var(--line2);margin:0 auto 9px;position:relative;z-index:1;display:grid;place-items:center}
  .tstep.done .tdot{background:var(--green);border-color:var(--green)} .tstep.done .tdot svg{width:12px;height:12px;color:#04140c}
  .tstep .tlab{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .tstep .tdate{font-size:12.5px;font-weight:600;margin-top:3px;font-family:'JetBrains Mono'}
  .tstep.pending .tdate{color:var(--amber)}
  .fin{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:14px}
  .fcard{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:var(--r);padding:17px}
  .fcard .lab{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
  .fcard .v{font-family:'JetBrains Mono';font-weight:700;font-size:21px;margin-top:7px}
  .fcard .v.green{color:var(--green)} .fcard .v.red{color:var(--red)}
  .fcard .bar{height:7px;border-radius:6px;background:rgba(255,255,255,.05);overflow:hidden;margin-top:12px}
  .fcard .bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--amber),var(--amber2));transition:width 1s cubic-bezier(.2,.8,.2,1)}
  .fcard .sub{font-size:11.5px;color:var(--muted);margin-top:8px}

  /* reconciliation */
  .recon{margin-bottom:6px}
  .reconhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .reconhead h3{font-family:'Space Grotesk';font-size:15px;font-weight:600;display:flex;align-items:center;gap:9px}
  .reconhead h3 svg{width:17px;height:17px;color:var(--amber)}
  .rboxes{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:14px}
  .rbox{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:var(--r);padding:17px;position:relative}
  .rbox .rtop{display:flex;align-items:center;gap:11px;margin-bottom:13px}
  .rbox .ri{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;background:rgba(255,176,32,.14);color:var(--amber)}
  .rbox .ri svg{width:17px;height:17px}
  .rbox .rlab{font-size:13px;font-weight:600;color:var(--text)}
  .rbox .rsub{font-size:11px;color:var(--muted);margin-top:1px}
  .rbox .rval{font-family:'JetBrains Mono';font-weight:700;font-size:23px;letter-spacing:-.5px}
  .rbox .rvar{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:20px;margin-top:11px}
  .rbox .rvar svg{width:12px;height:12px}
  .rbox .rvar.ok{background:rgba(52,211,153,.14);color:var(--green)}
  .rbox .rvar.diff{background:rgba(251,113,133,.14);color:var(--red)}
  .rbox .rvar.none{background:rgba(255,255,255,.05);color:var(--muted)}
  .rbox .rlink{position:absolute;top:16px;right:16px;font-size:11.5px;font-weight:600;color:var(--blue);text-decoration:none;display:inline-flex;align-items:center;gap:5px;cursor:pointer}
  .rbox .rlink svg{width:14px;height:14px} .rbox .rlink.add{color:var(--muted)} .rbox .rlink:hover{text-decoration:underline}
  .verdict{display:flex;align-items:flex-start;gap:13px;padding:16px 18px;border-radius:var(--r);border:1px solid var(--line)}
  .verdict.good{background:rgba(52,211,153,.09);border-color:rgba(52,211,153,.3)}
  .verdict.bad{background:rgba(251,113,133,.09);border-color:rgba(251,113,133,.3)}
  .verdict.info{background:rgba(255,255,255,.03)}
  .verdict .vi{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:none}
  .verdict .vi svg{width:17px;height:17px}
  .verdict.good .vi{background:rgba(52,211,153,.16);color:var(--green)} .verdict.bad .vi{background:rgba(251,113,133,.16);color:var(--red)} .verdict.info .vi{background:rgba(255,255,255,.06);color:var(--muted)}
  .verdict .vt b{font-weight:600;font-size:13.5px} .verdict .vt ul{margin:7px 0 0;padding-left:18px} .verdict .vt li{font-size:12.5px;color:var(--text2);margin-top:4px}
  .sectlabel{font-family:'Space Grotesk';font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:26px 0 12px}
  /* photos */

  .field input:focus,.field select:focus{outline:none;border-color:var(--amber);box-shadow:0 0 0 3px rgba(255,176,32,.18)}
  .field select option{background:var(--panel)}
  .mfoot{display:flex;justify-content:flex-end;gap:10px;padding:16px 22px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--panel2)}

  .mobtoggle{display:none}
  @media(max-width:980px){.kpis,.buckets{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}.fin{grid-template-columns:1fr}}
  @media(max-width:720px){

  }
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ============ persistence & auth ============ */
let saveT;
function flashSaved(silent,fail){if(silent)return;const p=document.getElementById('savepill');if(!p)return;p.textContent=fail?'⚠ Save failed':'✓ Saved';p.classList.add('on');clearTimeout(saveT);saveT=setTimeout(()=>{p.classList.remove('on');p.textContent=''},1600);}

async function save(silent){
  if(SB){try{const {error}=await SB.from('app_state').upsert({id:'main',data:state.data,updated_at:new Date().toISOString()});if(error)throw error;flashSaved(silent);}catch(e){console.error('save failed',e);flashSaved(silent,true);}}
  else{try{await window.storage.set(KEY,JSON.stringify(state.data));flashSaved(silent);}catch(e){console.error(e);}}

/* ============ helpers ============ */
function id(){return 'x'+Math.random().toString(36).slice(2,9)}
const inr=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:0});
function fdate(iso){if(!iso)return '—';const[y,m,d]=iso.split('-');return `${d}-${m}-${y}`}
function daysSince(iso){if(!iso)return 0;return Math.max(0,Math.floor((new Date()-new Date(iso))/86400000))}
function veh(vid){return state.data.vehicles.find(v=>v.id===vid)}
function totals(v){
  const ordered=(v.orders||[]).reduce((s,o)=>s+Number(o.amount||0),0);
  const received=(v.payments||[]).reduce((s,p)=>s+Number(p.amount||0),0);
  const billed=Number(v.billed||0);
  return {ordered,received,billed,due:billed-received,margin:billed-ordered};
}
const isActive=v=>v.status!=='Closed / Delivered';
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function today(){return new Date().toISOString().slice(0,10)}
function daysInShop(v){if(v.actDelivery&&v.entry)return Math.max(0,Math.floor((new Date(v.actDelivery)-new Date(v.entry))/86400000));return daysSince(v.entry)}
function recvDays(v){const base=v.billDate||v.actDelivery||v.expDelivery||v.entry;return daysSince(base)}
function ageCls(d){return d<=15?'a0':d<=30?'a1':d<=60?'a2':'a3'}
function insurerName(v){return v.claimType==='Cash'?'Cash / Direct':(v.insurer||'Unspecified')}
function moneyBadge(v){const t=totals(v);
  if(t.billed<=0)return {cls:'muted',text:isActive(v)?'Not billed':'No bill'};
  if(t.due>0)return {cls:'red',text:inr(t.due)+' due'};
  return {cls:'green',text:'Settled'};
}

/* ============ router / nav ============ */
function navItems(){return [
  ['dashboard','Dashboard',ic_grid],
  ['vehicles','Vehicles',ic_truck],
  ['receivables','Receivables',ic_wallet],
  ['insurer','By Insurer',ic_shield],

];}
function renderNav(){
  const due=state.data.vehicles.reduce((s,v)=>s+(totals(v).due>0?1:0),0);
  document.getElementById('nav').innerHTML=navItems().map(([v,label,icon])=>{
    const badge=(v==='receivables'&&due>0)?`<span class="badge">${due}</span>`:'';
    return `<button data-view="${v}" class="${state.view===v?'active':''}">${icon} ${label} ${badge}</button>`;
  }).join('');
}
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('button');if(b)go(b.dataset.view)});
function go(view,vid){if(view==='detail')state.from=state.view;state.view=view;state.vid=vid||null;if(view==='detail')state.tab='orders';document.getElementById('side').classList.remove('open');window.scrollTo(0,0);render()}

  if(state.view==='dashboard'){el.innerHTML=viewDashboard();animateDashboard();}
  else if(state.view==='vehicles')el.innerHTML=viewVehicles();
  else if(state.view==='receivables')el.innerHTML=viewReceivables();
  else if(state.view==='insurer')el.innerHTML=viewInsurer();
  else if(state.view==='aging')el.innerHTML=viewAging();
  else if(state.view==='detail'){el.innerHTML=viewDetail();requestAnimationFrame(animateBars);}
}
document.getElementById('view').addEventListener('click',e=>{const tb=e.target.closest('#tabs button');if(tb){state.tab=tb.dataset.tab;render()}});

/* ============ dashboard ============ */
function viewDashboard(){
  const vs=state.data.vehicles, active=vs.filter(isActive);
  const valueInShop=active.reduce((s,v)=>s+Number(v.estimate||0),0);
  const T=vs.reduce((a,v)=>{const t=totals(v);a.est+=Number(v.estimate||0);a.ord+=t.ordered;a.bil+=t.billed;a.rec+=t.received;return a;},{est:0,ord:0,bil:0,rec:0});
  const due=T.bil-T.rec;
  const collect=T.bil>0?Math.round(T.rec/T.bil*100):0;
  const max=Math.max(T.est,T.ord,T.bil,T.rec,1);

  const att=[];
  active.forEach(v=>{
    if(!v.permission){const d=daysSince(v.entry);att.push({t:'amber',ic:ic_clock,b:`${v.model} awaiting insurer approval`,s:`${d} day${d!==1?'s':''} since intake · ${v.customer}`,vid:v.id})}
    const t=totals(v);
    if(t.due>0&&v.status!=='Awaiting Approval'){att.push({t:'red',ic:ic_rupee,b:`${inr(t.due)} outstanding — ${v.model}`,s:`${recvDays(v)} days · ${insurerName(v)}`,vid:v.id})}
    if(v.expDelivery&&!v.actDelivery&&new Date(v.expDelivery)<new Date()){att.push({t:'amber',ic:ic_flag,b:`${v.model} past expected delivery`,s:`Due out ${fdate(v.expDelivery)}`,vid:v.id})}
  });
  const stc={};STATUSES.forEach(s=>stc[s]=0);vs.forEach(v=>stc[v.status]=(stc[v.status]||0)+1);

  const kpi=(cls,icon,lab,val,meta,money,goto)=>`
    <div class="kpi ${cls}" onclick="go('${goto}')"><div class="glow"></div>
      <div class="ic">${icon}</div><div class="lab">${lab}</div>
      <div class="val ${money?'money num':''}" data-count="${money||''}" data-target="${val}">${money?inr(0):'0'}</div>
      <div class="meta">${meta}</div><div class="arrow">${ic_arrow}</div></div>`;

  return `
  <div class="topbar">
    <div><div class="h">Dashboard</div><div class="sub">${active.length} vehicle${active.length!==1?'s':''} in the shop · live overview</div></div>
    <button class="btn" onclick="openVehicle()">${ic_plus} Add vehicle</button>
  </div>
  <div class="kpis">
    ${kpi('blue',ic_truck,'In the shop',active.length,`${vs.length} on record`,'','aging')}
    ${kpi('amber',ic_wrench,'Value in shop',valueInShop,'estimated, active',true,'vehicles')}
    ${kpi('red',ic_rupee,'Outstanding',due,'to be collected',true,'receivables')}
    ${kpi('green',ic_check,'Received',T.rec,'customer + insurer',true,'receivables')}
  </div>
  <div class="grid2">
    <div class="card"><div class="ch"><h3>${ic_flow} Cash flow at a glance</h3></div>
      <div class="flow">
        ${flowbar('Estimated','est',T.est,max)}
        ${flowbar('Ordered / spent','ord',T.ord,max)}
        ${flowbar('Billed','bil',T.bil,max)}
        ${flowbar('Received','rec',T.rec,max)}
        <div class="flowfoot">
          <div><div class="lab">Outstanding receivable</div><div class="big num">${inr(due)}</div></div>
          <div class="ringwrap">
            ${ring(collect,'var(--green)')}
            <div class="ringtxt"><div class="p num">${collect}%</div><div class="s">collected</div></div>
          </div>
        </div>
      </div>
    </div>
    <div class="card"><div class="ch"><h3>${ic_alert} Needs attention</h3><span class="cnt">${att.length}</span></div>
      <div class="att">${att.length?att.map(a=>`<div class="row" onclick="go('detail','${a.vid}')"><div class="ic ${a.t}">${a.ic}</div><div class="tx"><b>${esc(a.b)}</b><span>${esc(a.s)}</span></div></div>`).join(''):'<div class="empty">All clear. Nothing needs chasing.</div>'}</div>
    </div>
  </div>
  <div class="card"><div class="ch"><h3>${ic_grid} Pipeline</h3></div>
    <div class="statusstrip">${STATUSES.filter(s=>stc[s]>0).map(s=>{const c=STATUS_CLASS[s];return `<span class="sbadge"><span class="dot" style="background:${STATUS_DOT[c]}"></span>${esc(s)} <b>${stc[s]}</b></span>`}).join('')||'<span class="muted" style="color:var(--muted)">No vehicles yet.</span>'}</div>
  </div>`;
}
function flowbar(k,cls,v,max){return `<div class="flowbar"><div class="fl"><span class="k">${k}</span><span class="v num">${inr(v)}</span></div><div class="track"><i class="${cls}" style="width:0" data-w="${Math.round(v/max*100)}"></i></div></div>`}
function ring(pct,color){const c=245,off=c*(1-Math.max(0,Math.min(1,pct/100)));return `<svg class="ring" viewBox="0 0 90 90"><circle class="rbg" cx="45" cy="45" r="39"/><circle class="rfg" cx="45" cy="45" r="39" style="stroke:${color};stroke-dasharray:${c};stroke-dashoffset:${c}" data-off="${off}"/></svg>`}
function animateDashboard(){
  document.querySelectorAll('.kpi .val[data-target]').forEach(el=>{
    const target=+el.dataset.target||0,money=el.dataset.count!=='',dur=900,t0=performance.now();
    (function step(t){const p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,3),val=Math.round(target*e);el.textContent=money?inr(val):val;if(p<1)requestAnimationFrame(step);})(t0);
  });
  requestAnimationFrame(animateBars);
  requestAnimationFrame(()=>document.querySelectorAll('.ring .rfg').forEach(c=>c.style.strokeDashoffset=c.dataset.off));
}
function animateBars(){document.querySelectorAll('.track i[data-w], .fcard .bar i[data-w]').forEach(i=>i.style.width=i.dataset.w+'%')}

/* ============ vehicles ============ */
function viewVehicles(){
  const vs=state.data.vehicles;
  return `<div class="topbar"><div><div class="h">Vehicles</div><div class="sub">Every accident job, from intake to delivery</div></div><button class="btn" onclick="openVehicle()">${ic_plus} Add vehicle</button></div>
  ${vs.length?`<div class="vgrid">${vs.map(vcard).join('')}</div>`:'<div class="card"><div class="lempty">No vehicles yet. Add your first one to get started.</div></div>'}`;
}
function vcard(v){
  const t=totals(v),cls=STATUS_CLASS[v.status]||'slate',mb=moneyBadge(v);
  return `<div class="vcard" onclick="go('detail','${v.id}')">
    <div class="vtop"><span class="plate">${esc(v.reg)||'—'}</span><span class="chip ${cls}">${esc(v.status)}</span></div>
    <div class="model">${esc(v.model)||'Unnamed vehicle'}</div>
    <div class="cust">${esc(v.customer)||'—'} · ${esc(v.job)||''}</div>

/* ============ receivables ============ */
function viewReceivables(){
  const owed=state.data.vehicles.filter(v=>totals(v).due>0).map(v=>({v,t:totals(v),d:recvDays(v)})).sort((a,b)=>b.d-a.d);
  const total=owed.reduce((s,o)=>s+o.t.due,0);
  const B={b0:0,b1:0,b2:0,b3:0};owed.forEach(o=>{const d=o.d;if(d<=15)B.b0+=o.t.due;else if(d<=30)B.b1+=o.t.due;else if(d<=60)B.b2+=o.t.due;else B.b3+=o.t.due;});
  const bkt=(lab,val,cls)=>`<div class="bucket ${cls}"><div class="bl">${lab}</div><div class="bv num">${inr(val)}</div><div class="bc">${lab==='0–15 days'?'current':'ageing'}</div></div>`;
  return `<div class="topbar"><div><div class="h">Receivables</div><div class="sub">${inr(total)} outstanding across ${owed.length} vehicle${owed.length!==1?'s':''} · oldest first</div></div></div>
  <div class="buckets">
    ${bkt('0–15 days',B.b0,'')}${bkt('16–30 days',B.b1,'')}${bkt('31–60 days',B.b2,'')}${bkt('60+ days',B.b3,'warn')}
  </div>
  <div class="card"><div class="ch"><h3>${ic_wallet} Outstanding by vehicle</h3><span class="cnt">${owed.length}</span></div>
  ${owed.length?`<table class="tbl"><thead><tr><th>Vehicle</th><th>Party / Insurer</th><th class="r">Billed</th><th class="r">Received</th><th class="r">Due</th><th class="r">Days</th></tr></thead>
  <tbody>${owed.map(({v,t,d})=>`<tr class="clk" onclick="go('detail','${v.id}')">
    <td><div style="display:flex;align-items:center;gap:10px"><span class="plate">${esc(v.reg)}</span><div><div style="font-weight:600">${esc(v.model)}</div><div class="muted" style="color:var(--muted);font-size:12px">${esc(v.customer)}</div></div></div></td>
    <td>${esc(insurerName(v))}</td>
    <td class="r mono">${inr(t.billed)}</td><td class="r mono" style="color:var(--green)">${inr(t.received)}</td>
    <td class="r mono" style="color:var(--red);font-weight:700">${inr(t.due)}</td>
    <td class="r"><span class="agepill ${ageCls(d)}">${d}d</span></td></tr>`).join('')}</tbody></table>`
  :'<div class="lempty">Nothing outstanding. Everything billed has been collected. 🎉</div>'}</div>`;
}

/* ============ by insurer ============ */
function viewInsurer(){
  const g={};
  state.data.vehicles.forEach(v=>{const t=totals(v);if(t.due<=0)return;const k=insurerName(v);(g[k]=g[k]||{due:0,count:0,items:[]});g[k].due+=t.due;g[k].count++;g[k].items.push({v,t,d:recvDays(v)});});
  const groups=Object.entries(g).sort((a,b)=>b[1].due-a[1].due);
  const total=groups.reduce((s,[,x])=>s+x.due,0);
  return `<div class="topbar"><div><div class="h">By Insurer</div><div class="sub">${inr(total)} receivable, grouped by who owes you</div></div></div>
  ${groups.length?groups.map(([name,x])=>`
    <div class="card" style="margin-bottom:16px"><div class="ch"><h3>${ic_shield} ${esc(name)}</h3><span class="cnt">${inr(x.due)} · ${x.count} vehicle${x.count!==1?'s':''}</span></div>
    <table class="tbl"><tbody>${x.items.sort((a,b)=>b.d-a.d).map(({v,t,d})=>`<tr class="clk" onclick="go('detail','${v.id}')">
      <td><div style="display:flex;align-items:center;gap:10px"><span class="plate">${esc(v.reg)}</span><span style="font-weight:600">${esc(v.model)}</span></div></td>
      <td class="muted" style="color:var(--muted)">${esc(v.customer)}</td>
      <td class="r mono" style="color:var(--red);font-weight:700">${inr(t.due)}</td>
      <td class="r"><span class="agepill ${ageCls(d)}">${d}d</span></td></tr>`).join('')}</tbody></table></div>`).join('')
  :'<div class="card"><div class="lempty">No outstanding receivables to group. 🎉</div></div>'}`;
}

/* ============ aging (vehicles in shop) ============ */
function viewAging(){
  const active=state.data.vehicles.filter(isActive).map(v=>({v,d:daysInShop(v)})).sort((a,b)=>b.d-a.d);
  const B={b0:0,b1:0,b2:0,b3:0};active.forEach(o=>{const d=o.d;if(d<=7)B.b0++;else if(d<=15)B.b1++;else if(d<=30)B.b2++;else B.b3++;});
  const bkt=(lab,val,cls)=>`<div class="bucket ${cls}"><div class="bl">${lab}</div><div class="bv num">${val}</div><div class="bc">vehicle${val!==1?'s':''}</div></div>`;
  return `<div class="topbar"><div><div class="h">Aging</div><div class="sub">${active.length} vehicle${active.length!==1?'s':''} in the shop · longest first</div></div></div>
  <div class="buckets">${bkt('0–7 days',B.b0,'')}${bkt('8–15 days',B.b1,'')}${bkt('16–30 days',B.b2,'')}${bkt('30+ days',B.b3,'warn')}</div>
  <div class="card"><div class="ch"><h3>${ic_hour} Time in shop</h3><span class="cnt">${active.length}</span></div>
  ${active.length?`<table class="tbl"><thead><tr><th>Vehicle</th><th>Status</th><th>In since</th><th class="r">Awaiting approval</th><th class="r">Days in shop</th></tr></thead>
  <tbody>${active.map(({v,d})=>{const wait=!v.permission?daysSince(v.entry):null;return `<tr class="clk" onclick="go('detail','${v.id}')">
    <td><div style="display:flex;align-items:center;gap:10px"><span class="plate">${esc(v.reg)}</span><div><div style="font-weight:600">${esc(v.model)}</div><div class="muted" style="color:var(--muted);font-size:12px">${esc(v.customer)}</div></div></div></td>

/* ============ detail ============ */
function viewDetail(){
  const v=veh(state.vid);if(!v)return '';

  const pct=v.estimate?Math.min(100,Math.round(t.ordered/v.estimate*100)):0;
  const colPct=t.billed?Math.min(100,Math.round(t.received/t.billed*100)):0;
  const steps=[["Intake",v.entry],["Documents",v.docs],["Approval",v.permission],["Delivered",v.actDelivery]];
  return `<button class="back" onclick="go('${state.from||'dashboard'}')">${ic_chev} Back</button>
  <div class="dhead"><span class="plate big">${esc(v.reg)||'—'}</span><div class="model">${esc(v.model)||'Unnamed vehicle'}</div><span class="chip ${cls}">${esc(v.status)}</span>
    <div style="flex:1"></div>
    <button class="btn ghost sm" onclick="openVehicle('${v.id}')">${ic_edit} Edit</button>

  <div class="dcust"><b>${esc(v.customer)||'—'}</b> · ${esc(v.phone)||'no phone'} · ${v.claimType==='Cash'?'Cash job':esc(v.insurer||'insurer n/a')+' · Claim '+esc(v.claim||'—')} · ${esc(v.job)||''} · <b>${daysInShop(v)} days</b> ${isActive(v)?'in shop':'total'}</div>
  <div class="timeline">${steps.map(([lab,date],i)=>{const done=!!date,pend=!done&&(i===0||steps[i-1][1]);return `<div class="tstep ${done?'done':pend?'pending':''}"><div class="tdot">${done?ic_tick:''}</div><div class="tlab">${lab}</div><div class="tdate">${done?fdate(date):(pend?'pending':'—')}</div></div>`}).join('')}</div>
  <div class="fin">
    <div class="fcard"><div class="lab">Estimate</div><div class="v num">${inr(v.estimate)}</div><div class="bar"><i style="width:0" data-w="${pct}"></i></div><div class="sub">${inr(t.ordered)} ordered · ${pct}% of estimate</div></div>
    <div class="fcard"><div class="lab">Billed</div><div class="v num">${inr(t.billed)}</div><div class="bar"><i style="width:0" data-w="${colPct}"></i></div><div class="sub">${inr(t.received)} received · ${colPct}% collected</div></div>
    <div class="fcard"><div class="lab">Balance due</div><div class="v num ${t.due>0?'red':'green'}">${inr(t.due)}</div><div class="sub">${t.due>0?recvDays(v)+' days outstanding':'nothing pending'} · margin ${inr(t.margin)}</div></div>

    <button data-tab="documents" class="${state.tab==='documents'?'active':''}">Documents <span class="num">(${(v.documents||[]).length})</span></button>
    <button data-tab="photos" class="${state.tab==='photos'?'active':''}">Photos <span class="num">(${(v.photos||[]).length})</span></button>

function renderTab(v){
  if(state.tab==='orders'){
    const rows=(v.orders||[]).map(o=>`<div class="lrow" style="grid-template-columns:1fr 130px 100px 110px 34px">
      <div><b>${esc(o.item)}</b><div class="muted">${esc(o.vendor)||'—'}</div></div>

      <button class="del" onclick="delChild('${v.id}','orders','${o.id}')">${ic_trash}</button></div>`).join('');
    const oc=(v.orders||[]).length, ot=totals(v).ordered;
    return `<div class="tabhead" style="justify-content:space-between"><div style="display:flex;align-items:center;gap:6px;color:var(--text2);font-size:13px;font-weight:600">${oc} item${oc!==1?'s':''} · <span class="num" style="color:var(--text)">${inr(ot)}</span> total ordered</div><button class="btn sm" onclick="openOrder('${v.id}')">${ic_plus} Add order</button></div>${rows||'<div class="lempty">No parts ordered yet.</div>'}`;

      <button class="del" onclick="delChild('${v.id}','payments','${p.id}')">${ic_trash}</button></div>`).join('');
    return `<div class="tabhead"><button class="btn sm" onclick="openPayment('${v.id}')">${ic_plus} Record payment</button></div>${rows||'<div class="lempty">No payments received yet.</div>'}`;
  }
  if(state.tab==='photos'){
    const ph=v.photos||[];
    const grid=ph.length?`<div class="pgrid">${ph.map(p=>`<div class="pcell"><a href="${esc(p.url)}" target="_blank" rel="noopener noreferrer"><img src="${esc(p.url)}" loading="lazy" alt="vehicle photo"></a><button class="pdel" onclick="delPhoto('${v.id}','${p.id}')">${ic_trash}</button></div>`).join('')}</div>`:'<div class="lempty">No photos yet. Add before &amp; after shots of the vehicle.</div>';
    const head=state.uploading?`<span style="color:var(--amber);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:7px">${ic_clock} Uploading…</span>`:(SB?`<button class="btn sm" onclick="pickPhotos('${v.id}')">${ic_camera} Add photos</button>`:`<span style="color:var(--muted);font-size:12.5px">Photo upload works on your published cloud app</span>`);
    return `<div class="tabhead">${head}</div>${grid}`;
  }
  const rows=(v.documents||[]).map(d=>`<div class="lrow" style="grid-template-columns:150px 1fr 110px 34px">

  return `<div class="tabhead"><button class="btn sm" onclick="openDoc('${v.id}')">${ic_plus} Add document</button></div>${rows||'<div class="lempty">No documents linked yet.</div>'}`;
}
function delChild(vid,kind,cid){const v=veh(vid);v[kind]=v[kind].filter(x=>x.id!==cid);save();render()}

/* ============ modals ============ */
function modal(title,body,onSave,saveLabel){
  document.getElementById('modal-root').innerHTML=`<div class="scrim" id="scrim"><div class="modal" role="dialog" aria-modal="true">
    <div class="mh"><h3>${esc(title)}</h3><button class="x" onclick="closeModal()">${ic_x}</button></div>
    <div class="mbody">${body}</div>
    <div class="mfoot"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" id="msave">${saveLabel||'Save'}</button></div></div></div>`;
  document.getElementById('scrim').addEventListener('mousedown',e=>{if(e.target.id==='scrim')closeModal()});
  document.getElementById('msave').addEventListener('click',onSave);
}
function closeModal(){document.getElementById('modal-root').innerHTML=''}
function val(id){const e=document.getElementById(id);return e?e.value.trim():''}
function numval(id){return Number(val(id).replace(/[₹,\s]/g,''))||0}

/* ============ reconciliation ============ */
function reconCard(v){
  const ordered=totals(v).ordered, items=(v.orders||[]).length;
  const pi=Number(v.piAmount||0), req=Number(v.reqAmount||0);
  const varPill=(val)=>{
    if(!val)return `<span class="rvar none">not entered</span>`;
    if(!ordered)return `<span class="rvar none">no items yet</span>`;
    const d=val-ordered;
    if(d===0)return `<span class="rvar ok">${ic_tick} matches ordered</span>`;
    return `<span class="rvar diff">${ic_alert} ${d>0?'+':'−'}${inr(Math.abs(d))} vs ordered</span>`;
  };
  const linkBtn=(url)=> url&&/^https?:\/\//i.test(url)
    ? `<a class="rlink" href="${esc(url)}" target="_blank" rel="noopener noreferrer">${ic_view} View</a>`
    : `<span class="rlink add" onclick="openRecon('${v.id}')">${ic_paperclip} Attach</span>`;
  const issues=[];
  if(pi&&ordered&&pi!==ordered)issues.push(`Proforma invoice is ${inr(Math.abs(pi-ordered))} ${pi>ordered?'higher':'lower'} than the parts actually ordered.`);
  if(req&&ordered&&req!==ordered)issues.push(`Requisition slip is ${inr(Math.abs(req-ordered))} ${req>ordered?'higher':'lower'} than the parts ordered.`);
  if(pi&&req&&pi!==req)issues.push(`Proforma invoice and requisition slip differ by ${inr(Math.abs(pi-req))}.`);
  let verdict;
  if(!pi&&!req)verdict=`<div class="verdict info"><div class="vi">${ic_scale}</div><div class="vt"><b>Enter the PI and requisition amounts to auto-check for differences against the parts ordered.</b></div></div>`;
  else if(issues.length)verdict=`<div class="verdict bad"><div class="vi">${ic_alert}</div><div class="vt"><b>${issues.length} discrepanc${issues.length>1?'ies':'y'} found — worth a look:</b><ul>${issues.map(i=>`<li>${esc(i)}</li>`).join('')}</ul></div></div>`;
  else verdict=`<div class="verdict good"><div class="vi">${ic_tick}</div><div class="vt"><b>All documents reconcile — the PI and requisition match the parts ordered.</b></div></div>`;
  return `<div class="sectlabel">Parts reconciliation</div>
  <div class="recon">
    <div class="rboxes">
      <div class="rbox"><div class="rtop"><div class="ri">${ic_doc}</div><div><div class="rlab">Parts ordered</div><div class="rsub">${items} item${items!==1?'s':''}, auto-summed</div></div></div><div class="rval num">${inr(ordered)}</div><div><span class="rvar none">baseline</span></div>${linkBtn(v.linkOrder)}</div>
      <div class="rbox"><div class="rtop"><div class="ri">${ic_invoice}</div><div><div class="rlab">Proforma invoice</div><div class="rsub">final PI amount</div></div></div><div class="rval num">${inr(pi)}</div><div>${varPill(pi)}</div>${linkBtn(v.linkPI)}</div>
      <div class="rbox"><div class="rtop"><div class="ri">${ic_slip}</div><div><div class="rlab">Requisition slip</div><div class="rsub">handwritten total</div></div></div><div class="rval num">${inr(req)}</div><div>${varPill(req)}</div>${linkBtn(v.linkReq)}</div>
    </div>
    ${verdict}
    <div style="display:flex;justify-content:flex-end;margin-top:12px"><button class="btn ghost sm" onclick="openRecon('${v.id}')">${ic_edit} Enter amounts & attach files</button></div>
  </div>`;
}
function openRecon(vid){const v=veh(vid);
  modal('Reconciliation — amounts & documents',`<div class="fgrid">
    <div class="field"><label>Proforma invoice (PI) amount (₹)</label><input id="r_pi" inputmode="numeric" value="${v.piAmount||''}"></div>
    <div class="field"><label>Requisition slip amount (₹)</label><input id="r_req" inputmode="numeric" value="${v.reqAmount||''}"></div>
    <div class="field full"><label>Order list — Google Drive link</label><input id="r_lo" value="${esc(v.linkOrder)}" placeholder="https://drive.google.com/..."></div>
    <div class="field full"><label>Proforma invoice — Google Drive link</label><input id="r_lpi" value="${esc(v.linkPI)}" placeholder="https://drive.google.com/..."></div>
    <div class="field full"><label>Requisition slip — Google Drive link</label><input id="r_lreq" value="${esc(v.linkReq)}" placeholder="https://drive.google.com/..."></div>
  </div>`,()=>{v.piAmount=numval('r_pi');v.reqAmount=numval('r_req');v.linkOrder=val('r_lo');v.linkPI=val('r_lpi');v.linkReq=val('r_lreq');save();closeModal();render();},'Save');}

/* ============ photos (Supabase Storage) ============ */
const PHOTO_BUCKET='vehicle-photos';
function pickPhotos(vid){const inp=document.getElementById('photoInput');inp.dataset.vid=vid;inp.click();}
function resizeImage(file,max=1400,quality=0.8){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file),img=new Image();
    img.onload=()=>{let w=img.width,h=img.height;if(w>max||h>max){if(w>=h){h=Math.round(h*max/w);w=max;}else{w=Math.round(w*max/h);h=max;}}
      const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(url);
      c.toBlob(b=>b?res(b):rej(new Error('resize failed')),'image/jpeg',quality);};
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('not a readable image'));};img.src=url;});
}
async function uploadPhotos(vid,files){
  if(!SB){alert('Photo upload needs the published cloud version (Supabase).');return;}
  const v=veh(vid);v.photos=v.photos||[];state.uploading=true;render();let failed=0;
  for(const file of files){
    try{
      let blob,type='image/jpeg',ext='jpg';
      try{blob=await resizeImage(file);}catch(_){blob=file;type=file.type||'image/jpeg';ext=(file.name.split('.').pop()||'jpg').toLowerCase();}
      const path=vid+'/'+Date.now()+'-'+Math.random().toString(36).slice(2,7)+'.'+ext;
      const {error}=await SB.storage.from(PHOTO_BUCKET).upload(path,blob,{contentType:type,upsert:false});
      if(error)throw error;
      const {data}=SB.storage.from(PHOTO_BUCKET).getPublicUrl(path);
      v.photos.push({id:id(),url:data.publicUrl,path,date:today()});
    }catch(e){console.error('photo upload failed',e);failed++;}
  }
  state.uploading=false;await save();render();
  if(failed)alert(failed+' photo(s) failed to upload.\nUsually this means the "vehicle-photos" storage bucket or its policy isn\'t set up yet — or an iPhone HEIC photo couldn\'t be read.');
}
async function delPhoto(vid,pid){
  const v=veh(vid);const ph=(v.photos||[]).find(p=>p.id===pid);if(!ph)return;
  if(!confirm('Delete this photo? This cannot be undone.'))return;
  if(SB&&ph.path){try{await SB.storage.from(PHOTO_BUCKET).remove([ph.path]);}catch(e){console.error(e);}}
  v.photos=v.photos.filter(p=>p.id!==pid);await save();render();
}

/* ============ import / export ============ */
function exportData(){const blob=new Blob([JSON.stringify(state.data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='fleet-recovery-backup-'+today()+'.json';a.click();}
function importData(){document.getElementById('importfile').click()}
document.getElementById('importfile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(d&&Array.isArray(d.vehicles)){if(!confirm('This will REPLACE all '+state.data.vehicles.length+' vehicles currently in the app with '+d.vehicles.length+' from this backup file. This cannot be undone. Continue?'))return;state.data=d;save();render();alert('Data imported.')}else alert('That file does not look like a Fleet Recovery backup.')}catch{alert('Could not read that file.')}};
  r.readAsText(f);e.target.value='';});
document.getElementById('photoInput').addEventListener('change',e=>{const vid=e.target.dataset.vid;const files=[...e.target.files];e.target.value='';if(files.length&&vid)uploadPhotos(vid,files);});
